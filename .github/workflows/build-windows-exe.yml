name: Build Windows exe

on:
  push:
    branches: [main]
    paths:
      - "pota_tune_assist.py"
      - "requirements.txt"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-windows-exe
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.6,<7"

      # Console build purely for the smoke test below - a --windowed exe
      # shows an unhandled exception as a blocking dialog (no stderr to
      # read from CI), a console build prints the traceback and exits
      # with a non-zero code instead, which is scriptable. Same source,
      # same deps, so it reproduces packaging issues (e.g. missing Tcl/Tk
      # DLLs) identically to the real build.
      - name: Build smoke-test exe (console)
        run: pyinstaller --onefile --name "POTA-Tune-Assist-smoketest" pota_tune_assist.py

      - name: Smoke-test the build
        shell: pwsh
        run: |
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = "dist\POTA-Tune-Assist-smoketest.exe"
          $psi.RedirectStandardError = $true
          $psi.RedirectStandardOutput = $true
          $psi.UseShellExecute = $false
          $proc = [System.Diagnostics.Process]::Start($psi)
          Start-Sleep -Seconds 6
          if ($proc.HasExited) {
            Write-Host "---STDOUT---"
            Write-Host $proc.StandardOutput.ReadToEnd()
            Write-Host "---STDERR---"
            Write-Host $proc.StandardError.ReadToEnd()
            Write-Error "Smoke test FAILED: app exited immediately (exit code $($proc.ExitCode)). Build will NOT be committed."
            exit 1
          }
          Write-Host "Smoke test passed: app stayed running for 6s (no startup crash)."
          Stop-Process -Id $proc.Id -Force

      - name: Build exe
        run: pyinstaller --onefile --windowed --name "POTA-Tune-Assist" pota_tune_assist.py

      - name: Commit built exe
        shell: bash
        run: |
          cp dist/POTA-Tune-Assist.exe POTA-Tune-Assist.exe
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- POTA-Tune-Assist.exe; then
            echo "exe unchanged, nothing to commit."
            exit 0
          fi
          git add POTA-Tune-Assist.exe
          git commit -m "Automated build: update POTA-Tune-Assist.exe [skip ci]"
          git push origin HEAD:main
