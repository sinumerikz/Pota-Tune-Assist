name: Build Windows exe

on:
  push:
    branches: [main]
    paths:
      - "pota_tune_assist.py"
      - "requirements.txt"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-windows-exe
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --name "POTA-Tune-Assist" pota_tune_assist.py

      - name: Commit built exe
        shell: bash
        run: |
          cp dist/POTA-Tune-Assist.exe POTA-Tune-Assist.exe
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- POTA-Tune-Assist.exe; then
            echo "exe unchanged, nothing to commit."
            exit 0
          fi
          git add POTA-Tune-Assist.exe
          git commit -m "Automated build: update POTA-Tune-Assist.exe [skip ci]"
          git push origin HEAD:main
